apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: securitypolicies.nvtenant.severinsdigitalsolutions.nl
spec:
  group: nvtenant.severinsdigitalsolutions.nl
  names:
    kind: SecurityPolicy
    listKind: SecurityPolicyList
    plural: securitypolicies
    singular: securitypolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SecurityPolicy is the Schema for the securitypolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of SecurityPolicy
            properties:
              exemptions:
                items:
                  description: VulnerabilityExemption defines a specific CVE exemption
                  properties:
                    cveId:
                      description: The CVE ID, e.g., CVE-2024-1234
                      type: string
                    days:
                      description: The number of days the cve is discovered but not
                        yet fixed. (optional)
                      type: integer
                    expiresAt:
                      description: The required expiration date for this exemption
                        in dd/mm/yyyy format (optional)
                      pattern: ^\d{2}/\d{2}/\d{4}$
                      type: string
                    image:
                      description: The specific image for which this exemption applies,
                        e.g., "nginx:latest"
                      type: string
                    justification:
                      description: |-
                        Justification for the exemption (optional)
                        example: component_not_present, vulnerable_code_not_present, vulnerable_code_not_in_execute_path, vulnerable_code_cannot_be_controlled_by_adversary, inline_mitigations_already_exist
                      type: string
                    vexStatus:
                      description: VEX status for the exemption (required)
                      type: string
                  required:
                  - cveId
                  - image
                  - vexStatus
                  type: object
                type: array
            required:
            - exemptions
            type: object
          status:
            description: status defines the observed state of SecurityPolicy
            properties:
              activeCount:
                description: Aantal actieve uitzonderingen
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSync:
                description: Tijdstip van de laatste succesvolle sync
                format: date-time
                type: string
              synced:
                description: Synced geeft aan of de regels succesvol naar NeuVector
                  zijn gepusht
                type: boolean
            required:
            - activeCount
            - synced
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
