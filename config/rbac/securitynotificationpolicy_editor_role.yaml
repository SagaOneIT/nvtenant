# This rule is not used by the project nvtenant-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the nvtenant.severinsdigitalsolutions.nl.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nvtenant-operator
    app.kubernetes.io/managed-by: kustomize
  name: securitynotificationpolicy-editor-role
rules:
- apiGroups:
  - nvtenant.severinsdigitalsolutions.nl
  resources:
  - securitynotificationpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nvtenant.severinsdigitalsolutions.nl
  resources:
  - securitynotificationpolicies/status
  verbs:
  - get
