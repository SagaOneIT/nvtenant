# This rule is not used by the project nvtenant-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to nvtenant.severinsdigitalsolutions.nl resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nvtenant-operator
    app.kubernetes.io/managed-by: kustomize
  name: securitynotificationpolicy-viewer-role
rules:
- apiGroups:
  - nvtenant.severinsdigitalsolutions.nl
  resources:
  - securitynotificationpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - nvtenant.severinsdigitalsolutions.nl
  resources:
  - securitynotificationpolicies/status
  verbs:
  - get
