  name: vsecuritypolicy-v1alpha1.kb.io
  rules:
  - apiGroups:
    - nvtenant.severinsdigitalsolutions.nl
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - securitypolicies
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
